<title>アプリ要望ボード</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* レイアウト: 左にアプリ一覧、中央に要望の伝票リスト、右に選んだ伝票の詳細とやりとり */
:root {
  --paper: #EEF1EC;
  --surface: #FFFFFF;
  --ink: #1A231F;
  --muted: #3C4842;
  --line: #D3DAD3;
  --accent: #2F5D50;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCE8E2;
  --kaizen: #2D5C8F;
  --tsuika: #3D7A3A;
  --fuguai: #B23A2E;
  --warn: #9A6A00;
  --new: #D2462F;
  --shadow: 0 1px 2px rgba(26, 35, 31, .08), 0 6px 20px rgba(26, 35, 31, .06);
  --f-display: "Dela Gothic One", "Hiragino Kaku Gothic StdN", "Yu Gothic", sans-serif;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #131916; --surface: #1B2320; --ink: #E4EBE6; --muted: #BCC8C1; --line: #2D3833;
    --accent: #86C7AE; --accent-ink: #10201A; --accent-soft: #23352E;
    --kaizen: #8DB6E6; --tsuika: #8FCB86; --fuguai: #F08A7D; --warn: #E2B85A; --new: #FF7A63;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 20px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #131916; --surface: #1B2320; --ink: #E4EBE6; --muted: #BCC8C1; --line: #2D3833;
  --accent: #86C7AE; --accent-ink: #10201A; --accent-soft: #23352E;
  --kaizen: #8DB6E6; --tsuika: #8FCB86; --fuguai: #F08A7D; --warn: #E2B85A; --new: #FF7A63;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 20px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 17px;
  line-height: 1.6;
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap {
  max-width: 1360px;
  margin: 0 auto;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 18px;
}

/* ヘッダー */
.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
.brand h1 { font-family: var(--f-display); font-weight: 400; font-size: 28px; margin: 0; letter-spacing: .02em; line-height: 1.2; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 15px; }
.top-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.me { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; color: var(--muted); }
.me img { width: 24px; height: 24px; border-radius: 50%; }
.unread-btn {
  display: inline-flex; align-items: center; gap: 8px;
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 6px 14px; cursor: pointer; font-size: 15px;
}
.unread-btn b { font-family: var(--f-mono); color: var(--new); font-weight: 500; }
.unread-btn[aria-pressed="true"] { border-color: var(--new); }

/* 困りごとアプリへの入口 */
.trouble { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.trouble a.unread-btn { text-decoration: none; color: var(--accent-ink); background: var(--accent); border-color: var(--accent); font-weight: 700; }
.trouble form { display: flex; gap: 6px; flex-wrap: wrap; }
.trouble form input { width: min(320px, 70vw); }

/* 相手に知らせる文のパネル */
.share-panel { background: var(--surface); border: 1px solid var(--accent); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.share-panel textarea { min-height: 140px; font-size: 16px; }
.share-panel .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }

.banner { border: 1px dashed var(--line); border-radius: 8px; padding: 10px 14px; font-size: 15px; color: var(--muted); background: var(--surface); }

/* 3カラム */
.grid { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 18px; align-items: start; }
.grid.has-detail { grid-template-columns: 220px minmax(0, 1fr) minmax(0, 440px); }

/* アプリ一覧 */
.apps { display: flex; flex-direction: column; gap: 4px; }
.label { font-size: 13px; letter-spacing: .12em; color: var(--muted); font-weight: 700; margin: 0 0 6px; }
.app-btn {
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  width: 100%; text-align: left; border: 0; background: transparent; padding: 8px 10px;
  border-radius: 6px; cursor: pointer;
}
.app-btn:hover { background: var(--accent-soft); }
.app-btn[aria-current="true"] { background: var(--accent); color: var(--accent-ink); }
.app-btn .n { font-family: var(--f-mono); font-size: 14px; opacity: .8; }
.app-btn .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--new); display: inline-block; margin-left: 6px; }
.app-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.add-app { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.add-app input { min-width: 0; }

/* 選択中アプリの見出し（URL付き） */
.app-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
.app-head h2 { margin: 0; font-size: 19px; min-width: 0; overflow-wrap: anywhere; }
.app-head a { color: var(--accent); font-size: 15px; overflow-wrap: anywhere; min-width: 0; }
.app-head .none { color: var(--muted); font-size: 15px; }
.app-head form { display: flex; gap: 6px; flex: 1 1 260px; min-width: 0; }
.app-head form input { flex: 1; min-width: 0; }
.link-btn { border: 0; background: transparent; color: var(--muted); font-size: 14px; text-decoration: underline; cursor: pointer; padding: 2px 4px; }

input[type="text"], textarea, select {
  border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 7px 10px; width: 100%;
}
textarea { resize: vertical; min-height: 72px; }
.btn {
  border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink);
  border-radius: 6px; padding: 7px 14px; cursor: pointer; font-weight: 700; white-space: nowrap;
}
.btn.ghost { background: transparent; color: var(--accent); }
.btn.danger { border-color: var(--fuguai); background: transparent; color: var(--fuguai); }
.btn.danger.armed { background: var(--fuguai); color: var(--surface); }
.btn:disabled { opacity: .45; cursor: not-allowed; }

/* 中央: フィルタと伝票 */
.main { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; }
.tab {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px;
  font-size: 15px; cursor: pointer;
}
.tab[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.tab .n { font-family: var(--f-mono); font-size: 13px; margin-left: 4px; opacity: .7; }

.new-form {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px;
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;
}
.new-form .full { grid-column: 1 / -1; }
.new-form label { display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--muted); min-width: 0; }
.new-form .actions { grid-column: 1 / -1; display: flex; justify-content: flex-end; gap: 8px; }

.list { display: flex; flex-direction: column; gap: 8px; }
.slip {
  display: grid; grid-template-columns: 6px minmax(0, 1fr) auto; gap: 0 14px; align-items: stretch;
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 0;
  text-align: left; cursor: pointer; width: 100%; overflow: hidden;
}
.slip:hover { border-color: var(--muted); }
.slip[aria-current="true"] { border-color: var(--accent); box-shadow: var(--shadow); }
.slip .bar { background: var(--k, var(--accent)); }
.slip .body { padding: 10px 0; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.slip .t { font-weight: 700; display: flex; align-items: center; gap: 8px; min-width: 0; }
.slip .t span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slip .meta { font-size: 14px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; }
.slip .side { padding: 10px 14px 10px 0; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.k-kaizen { --k: var(--kaizen); }
.k-tsuika { --k: var(--tsuika); }
.k-fuguai { --k: var(--fuguai); }

.kind { font-size: 13px; font-weight: 700; color: var(--k); border: 1px solid var(--k); border-radius: 4px; padding: 0 6px; white-space: nowrap; }
.status { font-size: 14px; border-radius: 999px; padding: 1px 10px; white-space: nowrap; border: 1px solid var(--line); }
.st-todo { color: var(--muted); }
.st-doing { color: var(--kaizen); border-color: var(--kaizen); }
.st-review { color: var(--warn); border-color: var(--warn); font-weight: 700; }
.st-done { color: var(--tsuika); border-color: transparent; background: var(--accent-soft); }
.prio { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.prio.high { color: var(--fuguai); font-weight: 500; }
.newtag { font-size: 12px; font-weight: 700; color: var(--surface); background: var(--new); border-radius: 3px; padding: 0 5px; letter-spacing: .05em; flex: none; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

.empty { border: 1px dashed var(--line); border-radius: 10px; padding: 28px 20px; color: var(--muted); text-align: center; }
.empty strong { display: block; color: var(--ink); font-size: 18px; margin-bottom: 4px; }

/* 右: 詳細 */
.detail {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow);
  padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0;
  position: sticky; top: max(12px, env(safe-area-inset-top, 0px));
  max-height: calc(100vh - 24px); overflow-y: auto;
}
.detail-head { display: flex; justify-content: space-between; align-items: start; gap: 10px; }
.detail h2 { margin: 4px 0 0; font-size: 21px; line-height: 1.4; text-wrap: balance; overflow-wrap: anywhere; }
.close { border: 0; background: transparent; font-size: 22px; line-height: 1; cursor: pointer; color: var(--muted); padding: 2px 6px; }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.fields label { display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--muted); }
.desc { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
.desc.none { color: var(--muted); }
.desc.lead { font-size: 18px; }
.who { font-size: 14px; color: var(--muted); }

.thread { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--line); padding-top: 14px; }
.msg { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; }
.msg img { width: 28px; height: 28px; border-radius: 50%; }
.msg .h { font-size: 14px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
.msg .h b { color: var(--ink); }
.msg p { margin: 2px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.sys p { color: var(--muted); font-size: 15px; }
.reply { display: flex; flex-direction: column; gap: 8px; }
.reply .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.hint { font-size: 14px; color: var(--ink); }
.row-l { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

/* スクリーンショット */
.thumbs { display: flex; flex-wrap: wrap; gap: 8px; }
.shot {
  position: relative; width: 104px; height: 78px; padding: 0; border: 1px solid var(--line); border-radius: 6px;
  overflow: hidden; background: var(--paper); cursor: zoom-in; display: block;
}
.shot.pending { cursor: default; }
.shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
.shot .x {
  position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; border-radius: 50%; border: 0;
  background: var(--ink); color: var(--paper); font-size: 16px; line-height: 22px; padding: 0; cursor: pointer;
}
.shot-missing { display: grid; place-items: center; height: 100%; font-size: 13px; color: var(--muted); padding: 4px; text-align: center; }
.shots-in { display: flex; flex-direction: column; gap: 8px; }
.lightbox {
  position: fixed; inset: 0; z-index: 30; background: rgba(8, 12, 10, .86); display: grid; place-items: center; cursor: zoom-out;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.lightbox img { max-width: 100%; max-height: 100%; border-radius: 6px; background: var(--surface); }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--paper); padding: 8px 16px; border-radius: 999px; font-size: 15px;
  z-index: 20;
}

@media (max-width: 1100px) {
  .grid.has-detail { grid-template-columns: 200px minmax(0, 1fr); }
  .detail {
    position: fixed; z-index: 15; top: 0; right: 0; bottom: 0; max-height: none;
    width: min(460px, 100%); border-radius: 0;
    padding-top: calc(18px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    padding-right: max(18px, env(safe-area-inset-right, 0px));
  }
}
@media (max-width: 720px) {
  .grid, .grid.has-detail { grid-template-columns: minmax(0, 1fr); }
  .apps { flex-direction: row; flex-wrap: wrap; }
  .apps .label { width: 100%; }
  .app-btn { width: auto; border: 1px solid var(--line); background: var(--surface); }
  .add-app { width: 100%; }
  .new-form { grid-template-columns: minmax(0, 1fr); }
  .detail { padding-left: max(18px, env(safe-area-inset-left, 0px)); }
}
@media (prefers-reduced-motion: no-preference) {
  .slip, .tab, .app-btn { transition: border-color .15s, background-color .15s; }
}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>アプリ要望ボード</h1>
      <p>改善・追加・不具合を書き残して、それぞれのタイミングで返事をする場所</p>
    </div>
    <div class="top-right">
      <span class="me" id="me"></span>
      <span class="trouble" id="trouble"></span>
      <button class="unread-btn" id="share-btn" type="button">相手に知らせる</button>
      <button class="unread-btn" id="unread-btn" type="button" aria-pressed="false">未読の更新 <b id="unread-n">0</b></button>
    </div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <div class="share-panel" id="share-panel" hidden>
    <p class="label">LINE などに貼り付けて送る文</p>
    <textarea id="share-text" aria-label="相手に送る文"></textarea>
    <div class="row">
      <span class="hint">前回「コピー」してから、あなたが更新した要望をまとめています。内容は自由に直せます</span>
      <span class="row-l">
        <button class="btn ghost" type="button" id="share-close">閉じる</button>
        <button class="btn" type="button" id="share-copy">コピー</button>
      </span>
    </div>
  </div>

  <div class="grid" id="grid">
    <nav class="apps" id="apps" aria-label="アプリ">
      <p class="label">アプリ</p>
      <div id="app-list" class="apps"></div>
      <form class="add-app" id="add-app">
        <input type="text" id="new-app-name" placeholder="アプリ名を追加" maxlength="60" aria-label="新しいアプリ名">
        <input type="text" id="new-app-url" placeholder="URL（あれば）https://…" maxlength="500" inputmode="url" aria-label="アプリのURL">
        <button class="btn ghost" type="submit">追加</button>
      </form>
    </nav>

    <section class="main">
      <div class="app-head" id="app-head" hidden></div>
      <div class="toolbar">
        <div class="tabs" id="tabs" role="group" aria-label="状態で絞り込む"></div>
        <button class="btn" id="open-form" type="button">＋ 要望を書く</button>
      </div>

      <form class="new-form" id="new-form" hidden>
        <label class="full">アプリ
          <select id="f-app" required></select>
        </label>
        <label class="full">内容（どの画面で、何が、どうなってほしいか）
          <textarea id="f-body" maxlength="4000" required placeholder="例: スマホで見ると「パスワード」の文字が小さくて読みにくい。16pxくらいにしてほしい。"></textarea>
          <span class="hint">声で入力するには: パソコンは入力欄をクリックして Win + H、スマホはキーボードのマイクを押します</span>
        </label>
        <div class="full shots-in" id="f-shots-wrap" hidden>
          <div class="row-l">
            <button class="btn ghost" type="button" id="f-shots-btn">画像を添付</button>
            <input type="file" id="f-shots" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden>
            <span class="hint">スクリーンショットは貼り付け（Ctrl + V）でも添付できます。6枚まで</span>
          </div>
          <div id="f-shots-list"></div>
        </div>
        <div class="actions">
          <button class="btn ghost" type="button" id="cancel-form">やめる</button>
          <button class="btn" type="submit">書き残す</button>
        </div>
      </form>

      <div class="list" id="list"></div>
    </section>

    <aside class="detail" id="detail" hidden aria-label="要望の詳細"></aside>
  </div>
</div>

<div class="toast" id="toast" hidden role="status"></div>
<div class="lightbox" id="lightbox" hidden role="dialog" aria-label="画像の拡大"><img id="lightbox-img" alt="スクリーンショットの拡大"></div>

<script>
// 表示用の定義
const KINDS = { kaizen: "改善", tsuika: "追加", fuguai: "不具合" };
const STATUSES = { todo: "未着手", doing: "対応中", review: "確認待ち", done: "完了" };
const PRIOS = { high: "高", mid: "中", low: "低" };
const PRIO_ORDER = { high: 0, mid: 1, low: 2 };

// 画面の状態
const state = {
  db: null, user: null, assets: null, me: null, canWrite: true,
  apps: [], items: [], comments: [],
  app: "all", filter: "open", selected: null, formOpen: false,
  profiles: {},
};
let unsubComments = null;
// 送信前の添付画像（File のまま持つ）
const pendingNew = [];
const pendingReply = [];
const IMAGE_TYPES = ["image/png", "image/jpeg", "image/gif", "image/webp"];
const MAX_SHOTS = 6;

// 既読管理はこの端末のブラウザだけに保存する（相手には共有しない）
const SEEN_KEY = "seen-v1";
function loadSeen() { try { return JSON.parse(localStorage.getItem(SEEN_KEY) || "{}"); } catch { return {}; } }
function saveSeen(s) { try { localStorage.setItem(SEEN_KEY, JSON.stringify(s)); } catch {} }
let seen = loadSeen();

const $ = (id) => document.getElementById(id);

// 要素を作る小さなヘルパー（文字は必ず textContent で入れる）
function h(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null) e.append(c);
  return e;
}

function fmt(ts) {
  if (!ts) return "";
  const d = new Date(ts), now = new Date();
  const p = (n) => String(n).padStart(2, "0");
  const time = `${p(d.getHours())}:${p(d.getMinutes())}`;
  if (d.toDateString() === now.toDateString()) return `今日 ${time}`;
  const y = new Date(now); y.setDate(now.getDate() - 1);
  if (d.toDateString() === y.toDateString()) return `昨日 ${time}`;
  return `${d.getMonth() + 1}/${d.getDate()} ${time}`;
}

function toast(msg, ms = 2200) {
  const t = $("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), ms);
}

function showBanner(msg) { const b = $("banner"); b.textContent = msg; b.hidden = !msg; }

function name(id) {
  if (!id) return "だれか";
  if (id === state.me) return "あなた";
  return (state.profiles[id] && state.profiles[id].name) || "相手";
}

// 相手が更新した、まだ開いていない伝票
function isUnread(it) {
  return it.updatedBy && it.updatedBy !== state.me && (it.updatedAt || 0) > (seen[it.id] || 0);
}

function markSeen(it) {
  if (!it) return;
  seen[it.id] = Math.max(it.updatedAt || 0, Date.now());
  saveSeen(seen);
}

// 添付画像の追加（画像以外・上限超えは落とす）
function addFiles(arr, files) {
  const imgs = [...files].filter((f) => IMAGE_TYPES.includes(f.type));
  if (imgs.length < files.length) toast("PNG・JPEG・GIF・WebP の画像だけ添付できます");
  for (const f of imgs) {
    if (arr.length >= MAX_SHOTS) { toast(`画像は${MAX_SHOTS}枚までです`); break; }
    if (f.size > 20 * 1024 * 1024) { toast("20MB を超える画像は添付できません"); continue; }
    arr.push(f);
  }
  renderNewShots(); render();
}

function takePaste(e, arr) {
  if (!state.assets || !e.clipboardData) return;
  const files = [...e.clipboardData.files].filter((f) => IMAGE_TYPES.includes(f.type));
  if (!files.length) return;
  e.preventDefault();
  addFiles(arr, files);
}

// 送信前の画像一覧（×で外せる）
function pendingStrip(arr) {
  if (!arr.length) return null;
  return h("div", { class: "thumbs" }, arr.map((f, i) => {
    if (!f._url) f._url = URL.createObjectURL(f);
    return h("span", { class: "shot pending" },
      h("img", { src: f._url, alt: "添付する画像" }),
      h("button", { class: "x", type: "button", "aria-label": "この画像を外す", text: "×",
        onclick: () => { URL.revokeObjectURL(f._url); arr.splice(i, 1); renderNewShots(); render(); } }));
  }));
}

function renderNewShots() {
  $("f-shots-wrap").hidden = !state.assets;
  $("f-shots-list").replaceChildren(pendingStrip(pendingNew) || "");
}

// 保存済みの画像一覧（押すと拡大）
function shotGrid(ids) {
  if (!ids || !ids.length) return null;
  return h("div", { class: "thumbs" }, ids.map((id) => {
    const img = h("img", { src: "/_blob/" + id, alt: "スクリーンショット", loading: "lazy" });
    img.addEventListener("error", () => img.replaceWith(h("span", { class: "shot-missing", text: "画像を表示できません" })));
    return h("button", { class: "shot", type: "button", "aria-label": "画像を拡大", onclick: () => openLightbox(id) }, img);
  }));
}

function openLightbox(id) {
  $("lightbox-img").src = "/_blob/" + id;
  $("lightbox").hidden = false;
}
$("lightbox").addEventListener("click", () => ($("lightbox").hidden = true));

function attachButton(arr) {
  if (!state.assets) return null;
  const input = h("input", { type: "file", accept: IMAGE_TYPES.join(","), multiple: true, hidden: true,
    onchange: (e) => { addFiles(arr, e.target.files); e.target.value = ""; } });
  return [h("button", { class: "btn ghost", type: "button", text: "画像を添付", onclick: () => input.click() }), input];
}

async function uploadAll(files) {
  const ids = [];
  for (const f of files) ids.push((await state.assets.upload(f)).id);
  return ids;
}

function appName(id) {
  const a = state.apps.find((x) => x.id === id);
  return a ? a.name : "（削除されたアプリ）";
}

// 表示名をまとめて解決してから描画する
async function render() {
  if (state.user) {
    const ids = new Set();
    state.items.forEach((i) => { i.createdBy && ids.add(i.createdBy); i.updatedBy && ids.add(i.updatedBy); });
    state.comments.forEach((c) => c.by && ids.add(c.by));
    if (ids.size) state.profiles = await state.user.profiles([...ids]);
  }
  renderApps(); renderAppHead(); renderTrouble(); renderTabs(); renderList(); renderDetail(); renderUnread();
}

// URLとして使える形かを確かめる（http/https のみ）
function cleanUrl(s) {
  s = (s || "").trim();
  if (!s) return "";
  if (!/^https?:\/\//i.test(s)) s = "https://" + s;
  try { const u = new URL(s); return /^https?:$/.test(u.protocol) ? u.href : null; } catch { return null; }
}

// 困りごとアプリへの入口（URLは二人で共有）
let troubleUrl = "";
let editingTrouble = false;
function renderTrouble() {
  const box = $("trouble");
  if (editingTrouble) {
    box.replaceChildren(h("form", { onsubmit: (e) => { e.preventDefault(); saveTrouble($("trouble-url").value); } },
      h("input", { type: "text", id: "trouble-url", value: troubleUrl, placeholder: "困りごとアプリのURL https://…", inputmode: "url", "aria-label": "困りごとアプリのURL" }),
      h("button", { class: "btn", type: "submit", text: "保存" }),
      h("button", { class: "btn ghost", type: "button", text: "やめる", onclick: () => { editingTrouble = false; renderTrouble(); } })));
    return;
  }
  const kids = [];
  if (troubleUrl) kids.push(h("a", { class: "unread-btn", href: troubleUrl, target: "_blank", rel: "noopener noreferrer", text: "困りごとアプリを開く ↗" }));
  if (state.canWrite && state.db) kids.push(h("button", { class: troubleUrl ? "link-btn" : "unread-btn", type: "button",
    text: troubleUrl ? "URLを変更" : "困りごとアプリをつなぐ",
    onclick: () => { editingTrouble = true; renderTrouble(); $("trouble-url").focus(); } }));
  box.replaceChildren(...kids);
}

async function saveTrouble(raw) {
  const url = cleanUrl(raw);
  if (url === null) { toast("URLの形が正しくありません。https:// から始まるアドレスを入れてください"); return; }
  try {
    await state.db.doc("settings/links").set({ troubleUrl: url, updatedBy: state.me, updatedAt: Date.now() });
    editingTrouble = false;
    toast(url ? "困りごとアプリをつなぎました" : "困りごとアプリの入口を外しました");
    renderTrouble();
  } catch (e) { handleWriteError(e); }
}

let editingUrl = false;
function renderAppHead() {
  const box = $("app-head");
  const a = state.apps.find((x) => x.id === state.app);
  box.hidden = !a;
  if (!a) { editingUrl = false; return; }
  const kids = [h("h2", { text: a.name })];
  if (editingUrl) {
    kids.push(h("form", { onsubmit: (e) => { e.preventDefault(); saveUrl(a, $("edit-app-url").value); } },
      h("input", { type: "text", id: "edit-app-url", value: a.url || "", placeholder: "https://…", inputmode: "url", "aria-label": "アプリのURL" }),
      h("button", { class: "btn", type: "submit", text: "保存" }),
      h("button", { class: "btn ghost", type: "button", text: "やめる", onclick: () => { editingUrl = false; render(); } })));
  } else {
    kids.push(a.url
      ? h("a", { href: a.url, target: "_blank", rel: "noopener noreferrer", text: "アプリを開く ↗ " + a.url })
      : h("span", { class: "none", text: "URLは未登録" }));
    if (state.canWrite) kids.push(h("button", { class: "link-btn", type: "button", text: a.url ? "URLを変更" : "URLを登録",
      onclick: () => { editingUrl = true; render().then(() => $("edit-app-url") && $("edit-app-url").focus()); } }));
  }
  box.replaceChildren(...kids);
}

async function saveUrl(a, raw) {
  const url = cleanUrl(raw);
  if (url === null) { toast("URLの形が正しくありません。https:// から始まるアドレスを入れてください"); return; }
  try {
    await state.db.doc(`apps/${a.id}`).update({ url });
    editingUrl = false;
    toast(url ? "URLを保存しました" : "URLを外しました");
    render();
  } catch (e) { handleWriteError(e); }
}

function renderUnread() {
  const n = state.items.filter(isUnread).length;
  $("unread-n").textContent = n;
  // タブ名に未読数を出す
  document.title = n ? `(${n}) アプリ要望ボード` : "アプリ要望ボード";
  $("unread-btn").setAttribute("aria-pressed", state.filter === "unread");
}

function renderApps() {
  const box = $("app-list");
  const count = (id) => state.items.filter((i) => (id === "all" || i.appId === id) && i.status !== "done").length;
  const unread = (id) => state.items.some((i) => (id === "all" || i.appId === id) && isUnread(i));
  const btn = (id, label) => h("button", {
      class: "app-btn", type: "button", "aria-current": state.app === id ? "true" : "false",
      onclick: () => { state.app = id; render(); },
    },
    h("span", { class: "app-name" }, label, unread(id) ? h("span", { class: "dot", title: "未読あり" }) : null),
    h("span", { class: "n mono", text: String(count(id)) })
  );
  box.replaceChildren(btn("all", "すべて"), ...state.apps.map((a) => btn(a.id, a.name)));
  $("add-app").hidden = !state.canWrite;

  // 新規フォームのアプリ選択肢も更新
  const sel = $("f-app"), cur = sel.value;
  sel.replaceChildren(...state.apps.map((a) => h("option", { value: a.id, text: a.name })));
  sel.value = cur || (state.app !== "all" ? state.app : (state.apps[0] && state.apps[0].id) || "");
}

function inApp(i) { return state.app === "all" || i.appId === state.app; }

function renderTabs() {
  const base = state.items.filter(inApp);
  const defs = [
    ["open", "未完了", base.filter((i) => i.status !== "done").length],
    ["todo", "未着手", base.filter((i) => i.status === "todo").length],
    ["doing", "対応中", base.filter((i) => i.status === "doing").length],
    ["review", "確認待ち", base.filter((i) => i.status === "review").length],
    ["done", "完了", base.filter((i) => i.status === "done").length],
    ["all", "すべて", base.length],
  ];
  $("tabs").replaceChildren(...defs.map(([k, label, n]) => h("button", {
    class: "tab", type: "button", "aria-pressed": state.filter === k ? "true" : "false",
    onclick: () => { state.filter = k; render(); },
  }, label, h("span", { class: "n mono", text: String(n) }))));
}

function visibleItems() {
  return state.items.filter(inApp).filter((i) => {
    if (state.filter === "unread") return isUnread(i);
    if (state.filter === "open") return i.status !== "done";
    if (state.filter === "all") return true;
    return i.status === state.filter;
  }).sort((a, b) =>
    (isUnread(b) - isUnread(a)) ||
    ((b.updatedAt || 0) - (a.updatedAt || 0)));
}

function renderList() {
  const list = $("list");
  $("open-form").hidden = !state.canWrite;
  if (!state.apps.length) {
    list.replaceChildren(h("div", { class: "empty" },
      h("strong", { text: "まずはアプリを登録しましょう" }),
      "左の「アプリ名を追加」に、いま作っているアプリの名前を入れてください。そのあと「＋ 要望を書く」で改善点や追加したい機能を書き残せます。"));
    return;
  }
  const items = visibleItems();
  if (!items.length) {
    const msg = state.filter === "unread" ? "相手からの新しい更新はありません" : "この条件の要望はありません";
    list.replaceChildren(h("div", { class: "empty" }, h("strong", { text: msg }),
      state.canWrite ? "「＋ 要望を書く」から改善点や追加したい機能を書き残せます。" : ""));
    return;
  }
  list.replaceChildren(...items.map((it) => h("button", {
      class: `slip k-${it.kind}`, type: "button", "aria-current": state.selected === it.id ? "true" : "false",
      onclick: () => select(it.id),
    },
    h("span", { class: "bar" }),
    h("span", { class: "body" },
      h("span", { class: "t" }, isUnread(it) ? h("span", { class: "newtag", text: "NEW" }) : null, h("span", { text: it.title })),
      h("span", { class: "meta" },
        state.app === "all" ? h("span", { text: appName(it.appId) }) : null,
        h("span", { text: `${name(it.updatedBy || it.createdBy)}・${fmt(it.updatedAt || it.createdAt)}` }),
        it.lastNote ? h("span", { text: it.lastNote }) : null,
        it.shots && it.shots.length ? h("span", { text: `画像 ${it.shots.length}枚` }) : null)),
    h("span", { class: "side" },
      h("span", { class: `status st-${it.status}`, text: STATUSES[it.status] || "未着手" }))
  )));
}

function renderDetail() {
  const box = $("detail"), grid = $("grid");
  const it = state.items.find((i) => i.id === state.selected);
  box.hidden = !it;
  grid.classList.toggle("has-detail", !!it);
  if (!it) return;

  // 再描画で書きかけの返事が消えないように退避する
  const prev = $("d-reply");
  const draft = prev && prev.dataset.item === it.id ? prev.value : "";
  const hadFocus = prev && document.activeElement === prev;

  const ro = !state.canWrite;
  const statusSel = h("select", { id: "d-status", disabled: ro, onchange: (e) => changeField(it, "status", e.target.value) },
    Object.entries(STATUSES).map(([k, v]) => h("option", { value: k, text: v, selected: it.status === k })));

  const msgs = state.comments.map((c) => {
    const p = state.profiles[c.by];
    return h("div", { class: `msg${c.sys ? " sys" : ""}` },
      h("img", { src: p ? p.avatarUrl : "", alt: "" }),
      h("div", {},
        h("div", { class: "h" }, h("b", { text: name(c.by) }), h("span", { class: "mono", text: fmt(c.at) })),
        c.text ? h("p", { text: c.text }) : null,
        shotGrid(c.shots)));
  });

  const replyBox = ro ? null : h("form", { class: "reply", onsubmit: (e) => { e.preventDefault(); sendComment(it); } },
    h("textarea", { id: "d-reply", "data-item": it.id, maxlength: "4000", placeholder: "返事や質問、やってみた結果などを書く", "aria-label": "返事を書く",
      onpaste: (e) => takePaste(e, pendingReply) }),
    pendingStrip(pendingReply),
    h("div", { class: "row" },
      h("span", { class: "row-l" }, attachButton(pendingReply), h("span", { class: "hint", text: "Ctrl + Enter で送信。声で入力するには Win + H（スマホはキーボードのマイク）" })),
      h("button", { class: "btn", type: "submit", text: "返事を送る" })));

  const delBtn = ro ? null : h("button", { class: "btn danger", type: "button", text: "この要望を削除",
    onclick: (e) => {
      const b = e.currentTarget;
      if (!b.classList.contains("armed")) {
        b.classList.add("armed"); b.textContent = "もう一度押すと削除します";
        setTimeout(() => { b.classList.remove("armed"); b.textContent = "この要望を削除"; }, 4000);
        return;
      }
      deleteItem(it);
    } });

  box.replaceChildren(
    h("div", { class: `detail-head k-${it.kind}` },
      h("div", { style: "min-width:0" },
        h("span", { class: "who", text: appName(it.appId) }),
        it.autoTitle ? null : h("h2", { text: it.title })),
      h("button", { class: "close", type: "button", "aria-label": "閉じる", text: "×", onclick: () => select(null) })),
    h("div", { class: "fields" },
      h("label", {}, "状態", statusSel)),
    h("p", { class: `desc${it.body ? "" : " none"}${it.autoTitle ? " lead" : ""}`, text: it.body || "詳しい説明はまだありません" }),
    shotGrid(it.shots),
    h("div", { class: "who", text: `${name(it.createdBy)}が ${fmt(it.createdAt)} に書きました` }),
    h("div", { class: "thread" },
      h("p", { class: "label", text: "やりとり" }),
      msgs.length ? msgs : h("p", { class: "hint", text: "まだ返事はありません。気づいたことを書いておくと、相手が次に開いたときに読めます。" }),
      replyBox),
    delBtn);

  const ta = $("d-reply");
  if (ta && draft) ta.value = draft;
  if (ta && hadFocus) ta.focus();
  if (ta) ta.addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); sendComment(it); } });
}

// 伝票を選ぶとやりとりを購読する
function select(id) {
  state.selected = id;
  if (unsubComments) { unsubComments(); unsubComments = null; }
  state.comments = [];
  pendingReply.length = 0;
  const it = state.items.find((i) => i.id === id);
  if (it) markSeen(it);
  if (id && state.db) {
    unsubComments = state.db.collection(`items/${id}/comments`).orderBy("at").onSnapshot(
      (snap) => { state.comments = snap.docs.map((d) => ({ id: d.id, ...d.data() })); render(); },
      () => showBanner("やりとりを読み込めませんでした。ページを開き直してください。"));
  }
  render();
}

// 書き込みが拒否されたら閲覧専用に切り替える
function handleWriteError(e) {
  if (e && e.code === "invalid_argument") {
    state.canWrite = false;
    showBanner("このアカウントでは書き込みができません。共有した人に「編集者」として招待してもらってください。");
    render();
  } else if (e && e.code === "too_large") {
    toast("画像が大きすぎます。20MB 以下にしてください");
  } else if (e && e.code === "unsupported_type") {
    toast("PNG・JPEG・GIF・WebP の画像を選んでください");
  } else if (e && (e.code === "not_granted" || e.code === "capability_disabled")) {
    toast("このアカウントでは画像を添付できません");
  } else if (e && (e.code === "quota_exceeded" || e.code === "quota_or_state")) {
    toast("保存できる上限に達しました。完了した要望を削除してください。");
  } else {
    toast("保存できませんでした。少し待ってからもう一度試してください。");
  }
}

async function addComment(itemId, text, sys) {
  await state.db.collection(`items/${itemId}/comments`).add({ by: state.me, text, at: Date.now(), sys: !!sys });
}

async function changeField(it, field, value) {
  if (it[field] === value) return;
  const label = field === "status" ? `状態を「${STATUSES[value]}」にしました` : `優先度を「${PRIOS[value]}」にしました`;
  try {
    await state.db.doc(`items/${it.id}`).update({ [field]: value, updatedAt: Date.now(), updatedBy: state.me, lastNote: label });
    await addComment(it.id, label, true);
    markSeen({ id: it.id, updatedAt: Date.now() });
    toast("更新しました");
  } catch (e) { handleWriteError(e); }
}

let sending = false;
async function sendComment(it) {
  const ta = $("d-reply");
  const text = ta.value.trim();
  if ((!text && !pendingReply.length) || sending) return;
  sending = true;
  try {
    if (pendingReply.length) toast("画像をアップロード中…");
    const shots = pendingReply.length ? await uploadAll(pendingReply) : [];
    await state.db.collection(`items/${it.id}/comments`).add({ by: state.me, text, at: Date.now(), sys: false, shots });
    pendingReply.length = 0;
    const body = text || `画像 ${shots.length}枚`;
    const note = "返事: " + (body.length > 30 ? body.slice(0, 30) + "…" : body);
    await state.db.doc(`items/${it.id}`).update({ updatedAt: Date.now(), updatedBy: state.me, lastNote: note });
    markSeen({ id: it.id, updatedAt: Date.now() });
    if ($("d-reply")) $("d-reply").value = "";
    toast("送りました");
    render();
  } catch (e) { handleWriteError(e); }
  sending = false;
}

async function deleteItem(it) {
  try {
    // やりとりと添付画像も合わせて消す
    const shots = [...(it.shots || []), ...state.comments.flatMap((c) => c.shots || [])];
    for (const c of state.comments) await state.db.doc(`items/${it.id}/comments/${c.id}`).delete();
    await state.db.doc(`items/${it.id}`).delete();
    if (state.assets) for (const id of shots) { try { await state.assets.delete(id); } catch {} }
    select(null);
    toast("削除しました");
  } catch (e) { handleWriteError(e); }
}

// アプリの追加
$("add-app").addEventListener("submit", async (e) => {
  e.preventDefault();
  const input = $("new-app-name");
  const nm = input.value.trim();
  if (!nm || !state.db) return;
  const url = cleanUrl($("new-app-url").value);
  if (url === null) { toast("URLの形が正しくありません。https:// から始まるアドレスを入れてください"); return; }
  try {
    const ref = await state.db.collection("apps").add({ name: nm, url, createdBy: state.me, createdAt: Date.now() });
    input.value = ""; $("new-app-url").value = "";
    state.app = ref.id;
    toast(`「${nm}」を追加しました`);
    render();
  } catch (err) { handleWriteError(err); }
});

// 要望フォーム
function setForm(open) {
  state.formOpen = open;
  $("new-form").hidden = !open;
  if (open) {
    if (!state.apps.length) { $("new-form").hidden = true; toast("先にアプリを追加してください"); $("new-app-name").focus(); return; }
    if (state.app !== "all") $("f-app").value = state.app;
    $("f-body").focus();
  }
}
$("open-form").addEventListener("click", () => setForm(!state.formOpen));
$("cancel-form").addEventListener("click", () => setForm(false));
$("f-shots-btn").addEventListener("click", () => $("f-shots").click());
$("f-shots").addEventListener("change", (e) => { addFiles(pendingNew, e.target.files); e.target.value = ""; });
$("new-form").addEventListener("paste", (e) => takePaste(e, pendingNew));
$("new-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const body = $("f-body").value.trim();
  if (!body || !state.db) return;
  // 一覧用の見出しは内容の1行目から作る
  const first = body.split(/\r?\n/).find((l) => l.trim()) || body;
  const title = first.length > 50 ? first.slice(0, 50) + "…" : first;
  const now = Date.now();
  const data = {
    appId: $("f-app").value,
    title, autoTitle: true, body, status: "todo",
    createdBy: state.me, createdAt: now, updatedBy: state.me, updatedAt: now, lastNote: "新しく書かれました",
  };
  try {
    if (pendingNew.length) toast("画像をアップロード中…");
    data.shots = pendingNew.length ? await uploadAll(pendingNew) : [];
    const ref = await state.db.collection("items").add(data);
    $("f-body").value = "";
    pendingNew.length = 0; renderNewShots();
    setForm(false);
    markSeen({ id: ref.id, updatedAt: now });
    toast("書き残しました");
  } catch (err) { handleWriteError(err); }
});

// 相手に知らせる文を作る
const BOARD_URL = "https://claude.ai/artifact/5EjN3UkkNe8UB8bsuewfcH";
const NOTIFIED_KEY = "notified-at-v1";
function loadNotified() { try { return Number(localStorage.getItem(NOTIFIED_KEY)) || 0; } catch { return 0; } }
function buildShareText() {
  const since = loadNotified();
  const mine = state.items
    .filter((i) => i.updatedBy === state.me && (i.updatedAt || 0) > since)
    .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  if (!mine.length) return `アプリ要望ボードを見ておいてください。\n${BOARD_URL}`;
  const lines = mine.slice(0, 15).map((i) =>
    `・【${appName(i.appId)}】${i.title}（${STATUSES[i.status] || "未着手"}）` + (i.lastNote ? `\n　${i.lastNote}` : ""));
  if (mine.length > 15) lines.push(`ほか ${mine.length - 15}件`);
  return `アプリ要望ボードを更新しました（${mine.length}件）\n${lines.join("\n")}\n\n${BOARD_URL}`;
}
$("share-btn").addEventListener("click", () => {
  const p = $("share-panel");
  if (!p.hidden) { p.hidden = true; return; }
  $("share-text").value = buildShareText();
  p.hidden = false;
});
$("share-close").addEventListener("click", () => ($("share-panel").hidden = true));
$("share-copy").addEventListener("click", () => {
  const ta = $("share-text");
  const done = () => {
    try { localStorage.setItem(NOTIFIED_KEY, String(Date.now())); } catch {}
    toast("コピーしました。LINE などに貼り付けて送ってください", 3500);
  };
  const fallback = () => { ta.focus(); ta.select(); toast("文を選択しました。Ctrl + C でコピーしてください", 3500); };
  try {
    navigator.clipboard.writeText(ta.value).then(done, fallback);
  } catch { fallback(); }
});

$("unread-btn").addEventListener("click", () => { state.filter = state.filter === "unread" ? "open" : "unread"; render(); });
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (!$("lightbox").hidden) { $("lightbox").hidden = true; return; }
  if (state.selected) select(null);
});

// 起動
render();
(async () => {
  const [db, user, assets] = await Promise.all([
    window.claude ? claude.use("db") : null,
    window.claude ? claude.use("user") : null,
    window.claude ? claude.use("assets") : null,
  ]);
  state.db = db; state.user = user; state.assets = assets;
  renderNewShots();
  if (!db) {
    state.canWrite = false;
    showBanner("保存機能につながっていません。claude.ai にサインインした状態で開くと、書き込みと共有ができます。");
    render();
    return;
  }
  if (user) {
    const me = await user.me();
    state.me = me.id;
    $("me").replaceChildren(h("img", { src: me.avatarUrl, alt: "" }), h("span", { text: me.name || "あなた" }));
    const w = await user.can("data.write");
    if (w === false) {
      state.canWrite = false;
      showBanner("閲覧のみで開いています。書き込むには、共有した人に「編集者」として招待してもらってください。");
    }
  }
  db.doc("settings/links").onSnapshot(
    (snap) => { troubleUrl = (snap.exists && snap.data().troubleUrl) || ""; if (!editingTrouble) renderTrouble(); },
    () => {});
  db.collection("apps").orderBy("createdAt").onSnapshot(
    (snap) => { state.apps = snap.docs.map((d) => ({ id: d.id, ...d.data() })); render(); },
    () => showBanner("アプリ一覧を読み込めませんでした。ページを開き直してください。"));
  const loadedAt = Date.now();
  db.collection("items").onSnapshot(
    (snap) => {
      // 開いたあとに相手が更新したものを画面下で知らせる
      for (const ch of snap.docChanges()) {
        if (ch.type === "removed") continue;
        const d = ch.doc.data();
        if (d.updatedBy && d.updatedBy !== state.me && (d.updatedAt || 0) > loadedAt && ch.doc.id !== state.selected) {
          toast(`${name(d.updatedBy)}が「${d.title}」を更新しました`, 5000);
        }
      }
      state.items = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      // 開いている伝票が更新されたら既読にする
      const cur = state.items.find((i) => i.id === state.selected);
      if (cur) markSeen(cur);
      if (state.selected && !cur) select(null); else render();
    },
    () => showBanner("要望を読み込めませんでした。ページを開き直してください。"));
})();
</script>
